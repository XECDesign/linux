# Lives at: raspberrypi/linux/.github/workflows/kernel-release.yml on
# every branch that gets stable_* or oldstable_* tags (rpi-6.18.y and
# rpi-6.12.y at the time of writing). Tag-triggered runs use the
# workflow file at the tagged commit.
#
# The tag prefix picks the Debian release:
#   stable_<YYYYMMDD>     -> trixie
#   oldstable_<YYYYMMDD>  -> bookworm
#
# Two flows in one job:
#   - prerelease: push of a stable_/oldstable_ tag, or workflow_dispatch
#     with flow=prerelease. Drives a kernel pre-release build that
#     publishes to internal/main.
#   - release: GitHub Release promoted from pre-release to full release,
#     or workflow_dispatch with flow=release. Plays the manual
#     publish-public-main job on the matching pre-release pipeline,
#     which kicks off the promote-main / sync-beta-base /
#     mirror-to-github cascade.
#
# The release flow requires an existing successful prerelease pipeline
# for the same tag - it does not build, it just promotes.
#
# Required secrets (environment 'release'):
#   GITLAB_URL           GitLab instance URL.
#   PACKAGING_TOKEN      Project access token on the linux-packaging
#                        project: api scope, Maintainer role.
#   BRIDGE_TOKEN         Project access token on the bridge project:
#                        read_repository scope, Reporter role.
#   PACKAGING_PROJECT    linux-packaging project path on GitLab.
#   BRIDGE_PROJECT       Bridge tool's project path on GitLab.
# Required variables (org or repo level):
#   KERNEL_SOURCE_PATH   Path to the persistent raspberrypi/linux clone
#                        on the runner. Variable rather than secret
#                        because container.volumes is evaluated before
#                        the secrets context is available.
#   CI_AUTHOR_NAME       Name attributed to bridge-driven commits and
#                        the debian/changelog entry.
#   CI_AUTHOR_EMAIL      Email attributed to the same.

name: kernel release

on:
  push:
    tags:
      - 'stable_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]'
      - 'oldstable_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]'
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      flow:
        description: 'Which path to run (release requires an existing successful prerelease pipeline)'
        required: true
        type: choice
        options:
          - prerelease
          - release
      tag:
        description: 'Kernel tag (stable_YYYYMMDD or oldstable_YYYYMMDD)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (no rpi/update, no GitLab push)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kernel-release-${{ github.event_name }}-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  bridge:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' &&
       (startsWith(github.event.release.tag_name, 'stable_') ||
        startsWith(github.event.release.tag_name, 'oldstable_')))
    runs-on: [self-hosted, linux, linux-bridge]
    timeout-minutes: 30
    environment: release
    container:
      image: debian:stable
      volumes:
        - ${{ vars.KERNEL_SOURCE_PATH }}:${{ vars.KERNEL_SOURCE_PATH }}
    env:
      GITLAB_BASE: ${{ secrets.GITLAB_URL }}
      GITLAB_PROJECT: ${{ secrets.PACKAGING_PROJECT }}
      GITLAB_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
      LINUX_SRC: ${{ vars.KERNEL_SOURCE_PATH }}
      TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      GIT_AUTHOR_NAME: ${{ vars.CI_AUTHOR_NAME }}
      GIT_AUTHOR_EMAIL: ${{ vars.CI_AUTHOR_EMAIL }}
      GIT_COMMITTER_NAME: ${{ vars.CI_AUTHOR_NAME }}
      GIT_COMMITTER_EMAIL: ${{ vars.CI_AUTHOR_EMAIL }}
      DEBFULLNAME: ${{ vars.CI_AUTHOR_NAME }}
      DEBEMAIL: ${{ vars.CI_AUTHOR_EMAIL }}
    steps:
      # All file work happens under /build (container-local). The bind-mounted
      # workspace stays empty so host-side cleanup never has to fight
      # root-owned files left behind by the container.
      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            devscripts \
            git \
            git-buildpackage \
            python3-minimal \
            quilt
          mkdir -p /build

      - name: Resolve release
        id: release
        run: |
          case "$TAG" in
            stable_[0-9]*)    codename=trixie ;;
            oldstable_[0-9]*) codename=bookworm ;;
            *) echo "unrecognised kernel tag '$TAG'" >&2; exit 1 ;;
          esac
          echo "codename=$codename" >> "$GITHUB_OUTPUT"

      - name: Sync bridge from GitLab
        working-directory: /build
        env:
          BRIDGE_PROJECT: ${{ secrets.BRIDGE_PROJECT }}
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
        run: |
          host="${GITLAB_BASE#https://}"
          clone_url="https://oauth2:${BRIDGE_TOKEN}@${host}/${BRIDGE_PROJECT}.git"
          git clone --depth 1 "$clone_url" bridge

      - name: Sync linux-packaging from GitLab
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.flow == 'prerelease')
        working-directory: /build
        run: |
          host="${GITLAB_BASE#https://}"
          clone_url="https://oauth2:${GITLAB_TOKEN}@${host}/${GITLAB_PROJECT}.git"
          git clone "$clone_url" linux-packaging

      - name: Run bridge (prerelease)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.flow == 'prerelease')
        working-directory: /build
        run: |
          git config --global --add safe.directory "$LINUX_SRC"
          git -C "$LINUX_SRC" fetch --all --tags --prune
          ./bridge/bridge prerelease \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            --packaging ./linux-packaging \
            --linux "$LINUX_SRC" \
            --codename ${{ steps.release.outputs.codename }} \
            "$TAG"

      - name: Run bridge (release)
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.flow == 'release')
        working-directory: /build
        run: |
          git config --global --add safe.directory "$LINUX_SRC"
          git -C "$LINUX_SRC" fetch --all --tags --prune
          ./bridge/bridge release \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            --linux "$LINUX_SRC" \
            --codename ${{ steps.release.outputs.codename }} \
            "$TAG"
